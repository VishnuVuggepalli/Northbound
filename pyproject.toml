[project]
name = "northbound"
version = "0.1.0"
description = "Self-serve switch port management portal"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
 "fastapi>=0.115",
 "uvicorn[standard]>=0.32",
 "pydantic>=2.9",
 "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade,
# SIM = simplify, RUF = ruff-specific, C90 = mccabe complexity
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C90"]
ignore = [
  "E501",  # line too long — formatter handles this
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"   # bump to "strict" later
reportMissingImports = "error"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"

[build-system]
requires= ["setuptools>=68" , "wheel"]
build-backend= "setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src"]
