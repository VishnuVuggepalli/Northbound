[project]
name = "northbound"
version = "0.1.0"
description = "Self-serve switch port management portal"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
 "fastapi>=0.115",
 "uvicorn[standard]>=0.32",
 "pydantic>=2.9",
 "pydantic-settings>=2.5",
 "puresnmp>=2.0",
 "asyncssh>=2.18",
 "ncclient>=0.6.16",
 "beautifulsoup4>=4.12",
 "lxml>=5.3",
 # Battle-tested, community-maintained CLI parsing templates (TextFSM) instead of
 # hand-rolled column/regex parsers for Cisco IOS `show` output. ntc-templates is
 # the Network-to-Code project; tested against real devices across IOS versions.
 "ntc-templates>=4.0",
 "textfsm>=1.1",
 # Real multi-vendor network device libraries — drivers are backed by these,
 # NOT hand-rolled protocol/commit-confirm logic. napalm: eos (pyeapi) / nxos /
 # ios with structured exceptions + confirmed-commit.
 #
 # Pica8 PicOS speaks its OWN NETCONF YANG (http://pica8.com/xorplus/*), NOT
 # Junos. PyEZ/junos-eznc was live-tested against PicOS-V and every Junos RPC
 # was rejected ("operation not supported by this implementation"), so the
 # Pica8 driver uses ncclient (the de-facto NETCONF library, pinned above)
 # directly via NetconfClient — NOT PyEZ. junos-eznc remains only as a
 # transitive dependency of napalm (napalm.junos imports it at package init);
 # pinned explicitly so the lockfile is honest about it.
 "napalm>=5.0",
 "junos-eznc>=2.7",
 # DB layer + migrations + at-rest credential encryption (standard, battle-tested libs).
 "sqlalchemy[asyncio]>=2.0",
 "aiosqlite>=0.20",
 # Async Postgres driver. SQLite (aiosqlite) is the single-worker default; a
 # `postgresql+asyncpg://` NB_DB_URL switches the engine with no API changes.
 # Shipped as a base dep (not an extra) so a Postgres URL works out of the box —
 # an optional driver that is imported only on connect would crash at first
 # request, not at install (the same trap that bit httpx).
 "asyncpg>=0.29",
 "alembic>=1.13",
 "cryptography>=43.0",
 # Auth layer: JWT (jose), password hashing (passlib/bcrypt), login throttle (slowapi).
 # Standard, battle-tested — no hand-rolled crypto/JWT.
 "python-jose[cryptography]>=3.3",
 "passlib[bcrypt]>=1.7",
 # bcrypt pinned <4.1: passlib 1.7.4 is incompatible with bcrypt >=4.1 (backend
 # introspection breaks) and bcrypt 5.0 hard-raises on >72-byte secrets.
 "bcrypt>=4.0,<4.1",
 "slowapi>=0.1.9",
 # In-process job scheduler (reachability poll, nightly backup, audit-chain
 # verify, reconciler tick). AsyncIOScheduler runs on the app event loop — no
 # Redis/Celery broker, per the single-process architecture (principal-eng D9).
 "apscheduler>=3.10",
 # Async HTTP client — backs the shared HttpxClient transport and the MikroTik
 # RouterOS REST driver (imported at module load), so it's a RUNTIME dep, not dev.
 "httpx>=0.27",
 # Server-Sent Events for live state push (F157). Battle-tested ASGI SSE impl
 # with keep-alive ping + client-disconnect cleanup — not hand-rolled over a
 # bare StreamingResponse.
 "sse-starlette>=2.1",
]

[project.optional-dependencies]
# Shared rate-limit storage for multi-worker deployments. Without it slowapi
# keeps per-process in-memory counters, so N workers allow ~N× the configured
# limit. Install with `.[redis]` and set NB_RATELIMIT_STORAGE_URI=redis://… when
# running more than one worker. Imported lazily by `limits` only when that URI
# is set, so a single-worker install never needs it.
redis = [
  "redis>=5.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pyright>=1.1",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade,
# SIM = simplify, RUF = ruff-specific, C90 = mccabe complexity
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C90"]
ignore = [
  "E501",  # line too long — formatter handles this
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"   # bump to "strict" later
reportMissingImports = "error"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"

[build-system]
requires= ["setuptools>=68" , "wheel"]
build-backend= "setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src"]

[tool.setuptools.package-data]
# Ship the TextFSM templates (parse PicOS CLI) + Jinja2 config templates (render
# CLI write config, e.g. Arista EOS) — both are loaded from disk at runtime.
"northbound.drivers" = ["textfsm_templates/**/*.textfsm", "config_templates/**/*.j2"]
