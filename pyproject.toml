[project]
name = "northbound"
version = "0.1.0"
description = "Self-serve switch port management portal"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
 "fastapi>=0.115",
 "uvicorn[standard]>=0.32",
 "pydantic>=2.9",
 "pydantic-settings>=2.5",
 "puresnmp>=2.0",
 "asyncssh>=2.18",
 "ncclient>=0.6.16",
 "beautifulsoup4>=4.12",
 "lxml>=5.3",
 # DB layer + migrations + at-rest credential encryption (standard, battle-tested libs).
 "sqlalchemy[asyncio]>=2.0",
 "aiosqlite>=0.20",
 "alembic>=1.13",
 "cryptography>=43.0",
 # Auth layer: JWT (jose), password hashing (passlib/bcrypt), login throttle (slowapi).
 # Standard, battle-tested — no hand-rolled crypto/JWT.
 "python-jose[cryptography]>=3.3",
 "passlib[bcrypt]>=1.7",
 # bcrypt pinned <4.1: passlib 1.7.4 is incompatible with bcrypt >=4.1 (backend
 # introspection breaks) and bcrypt 5.0 hard-raises on >72-byte secrets.
 "bcrypt>=4.0,<4.1",
 "slowapi>=0.1.9",
 # In-process job scheduler (reachability poll, nightly backup, audit-chain
 # verify, reconciler tick). AsyncIOScheduler runs on the app event loop — no
 # Redis/Celery broker, per the single-process architecture (principal-eng D9).
 "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "pyright>=1.1",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade,
# SIM = simplify, RUF = ruff-specific, C90 = mccabe complexity
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C90"]
ignore = [
  "E501",  # line too long — formatter handles this
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"   # bump to "strict" later
reportMissingImports = "error"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"

[build-system]
requires= ["setuptools>=68" , "wheel"]
build-backend= "setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src"]
