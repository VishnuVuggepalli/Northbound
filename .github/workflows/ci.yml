name: CI

on:
  push:
    branches: [main, real-data-no-mocks]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend gate (ruff · pyright · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (runtime + dev deps)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Format check (ruff)
        run: ruff format --check src tests
      - name: Type check (pyright)
        # Point pyright at the interpreter where deps were installed so imports
        # resolve (matches the local `pyright --pythonpath .venv/bin/python`).
        run: pyright --pythonpath "$(which python)"
      - name: Tests (pytest)
        run: pytest -q
        # The suite is self-contained: tests that need secrets set their own.
        # Live-device tests skip unless NB_LIVE_* is set (never in CI).

  frontend:
    name: Frontend gate (tsc · eslint · vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check (tsc)
        run: npx tsc -b --noEmit
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (vitest)
        run: npm run test

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Build the deployable image only after both gates pass.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The image copies a prebuilt SPA (the in-container npm install is OOM-prone
      # on constrained hosts), so build dist on the runner first.
      - name: Build SPA
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build image
        run: docker build -t northbound:ci .
