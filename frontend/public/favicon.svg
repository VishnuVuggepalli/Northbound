<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Northbound">
  <!-- Dark rounded tile so the mark reads on light OR dark browser tabs -->
  <rect width="32" height="32" rx="7" fill="#0a0c10"/>
  <!-- Instrument bezel -->
  <circle cx="16" cy="16" r="11.2" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.4"/>
  <!-- Cardinal ticks -->
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.3">
    <line x1="16" y1="3.4" x2="16" y2="5.6"/>
    <line x1="16" y1="26.4" x2="16" y2="28.6"/>
    <line x1="3.4" y1="16" x2="5.6" y2="16"/>
    <line x1="26.4" y1="16" x2="28.6" y2="16"/>
  </g>
  <!-- Compass needle — north half takes the accent (cyan), south half dims -->
  <path d="M16 5.3 L19.6 16.5 L16 14.5 L12.4 16.5 Z" fill="#6bd0e8"/>
  <path d="M16 26.7 L12.4 15.5 L16 17.5 L19.6 15.5 Z" fill="#ffffff" fill-opacity="0.32"/>
  <!-- Hub -->
  <circle cx="16" cy="16" r="1.45" fill="#ffffff"/>
</svg>
