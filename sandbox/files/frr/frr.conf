! Minimal FRR config for the Northbound sandbox FRR node.
! Gives `vtysh -c "show running-config"` a deterministic, non-empty payload
! so the SSH read path has something real to parse.
frr version 9.1
frr defaults traditional
hostname frr-router-01
!
interface eth1
 description nb-sandbox-uplink
 ip address 10.20.20.1/24
!
router bgp 65001
 bgp router-id 10.20.20.1
 neighbor 10.20.20.2 remote-as 65002
!
line vty
!
